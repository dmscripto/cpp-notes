[project]
site_name = "C++ notes"
site_description = "Personal notes on C++ and algorithms, with interactive visualizations"
# GitHub Pages address: https://<user>.github.io/<repository>/
site_url = "https://dmscripto.github.io/cpp-notes/"
repo_url = "https://github.com/dmscripto/cpp-notes"
repo_name = "cpp-notes"

# Navigation. Every new page must be added here. A bare path takes its title
# from the page's H1; the first page of a section is its overview (section
# title links to it). Algorithm pages are grouped like the sections of
# docs/algorithms-library/index.md, in cppreference order; the groups exist
# only here, the files stay flat so URLs do not change when regrouping.
nav = [
  { "Home" = "index.md" },
  { "Sorting" = [
    "sorting/index.md",
    "sorting/bubble-sort.md",
  ] },
  { "Algorithms library" = [
    "algorithms-library/index.md",
    { "Non-modifying" = [
      "algorithms-library/find.md",
    ] },
    { "Sorting and related" = [
      "algorithms-library/sort.md",
    ] },
  ] },
]

extra_css = [
  "https://unpkg.com/katex@0.16.22/dist/katex.min.css",
  "stylesheets/layout.css",
  "stylesheets/sidebars.css",
  "stylesheets/algo-viz.css",
  "stylesheets/std.css",
]
extra_javascript = [
  "javascripts/katex.js",
  "https://unpkg.com/katex@0.16.22/dist/katex.min.js",
  "https://unpkg.com/katex@0.16.22/dist/contrib/auto-render.min.js",
  "javascripts/algo-viz.js",
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # Keep the current heading visible in a long table of contents.
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/braces"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# C++ sources live in code/ and are pulled into pages with --8<-- "path".
# check_paths makes the build fail if a referenced file is missing.
pymdownx.snippets.base_path = ["code"]
pymdownx.snippets.check_paths = true
# Sections cut from inside a function lose their common indentation.
pymdownx.snippets.dedent_subsections = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
