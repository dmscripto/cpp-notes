name: Documentation
on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every C++ file that the site shows must compile and pass its tests.
  test-code:
    # Pinned: the C++26 examples need GCC 15 or newer (g++ 15.2 here).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Compile and run C++ tests
        run: |
          g++ --version | head -1
          bash scripts/test-code.sh

  deploy:
    needs: test-code
    # Pull requests only run the checks; the site is published from main/master.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
